# Workspace root: one .venv serves every Python package (core/python and jupyter).
[project]
name = "blaym-notebook-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["blaym-notebook", "blaym-jupyter[dev,test]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core/python", "jupyter"]

[tool.uv.sources]
blaym-notebook = { workspace = true }
blaym-jupyter = { workspace = true }
blaym-notebook-types = { path = "../blaym-notebook-types", editable = true }

[tool.pytest.ini_options]
testpaths = ["core/python", "jupyter"]
markers = ["slow: real-process and real-kernel tests, left out of the default run (use -m slow)"]
addopts = "-m 'not slow'"
